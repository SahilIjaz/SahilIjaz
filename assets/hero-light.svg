<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="tag"><rect x="72" y="150" width="0" height="36"><animate attributeName="width" from="0" to="720" begin="1.0s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0ea5a4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#f6f8fb"/>
  <g stroke="#d6dde8" stroke-width="1" opacity="0.6">
    <path d="M0 240 H1200"/><path d="M0 60 H1200"/>
  </g>
  <rect x="72" y="60" width="0" height="4" rx="2" fill="url(#g)"><animate attributeName="width" from="0" to="120" begin="0.2s" dur="0.6s" fill="freeze"/></rect>
  <text x="72" y="118" font-size="56" font-weight="700" fill="#0f172a" letter-spacing="-1" opacity="0">Sahil Ijaz<animate attributeName="opacity" to="1" begin="0.4s" dur="0.5s" fill="freeze"/></text>
  <g clip-path="url(#tag)">
    <text x="72" y="176" font-size="24" fill="#5b6577">Software Engineer <tspan fill="#0ea5a4" font-weight="600">· DevOps focused</tspan> <tspan fill="#5b6577">· CI/CD, containers, cloud</tspan></text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5b6577">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.1s" dur="0.4s" fill="freeze"/><rect x="72" y="204" width="74" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="109" y="221" text-anchor="middle">Docker</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.3s" dur="0.4s" fill="freeze"/><rect x="156" y="204" width="98" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="205" y="221" text-anchor="middle">Kubernetes</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.5s" dur="0.4s" fill="freeze"/><rect x="264" y="204" width="118" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="323" y="221" text-anchor="middle">GitHub Actions</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.7s" dur="0.4s" fill="freeze"/><rect x="392" y="204" width="56" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="420" y="221" text-anchor="middle">AWS</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.9s" dur="0.4s" fill="freeze"/><rect x="458" y="204" width="64" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="490" y="221" text-anchor="middle">Nginx</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.4s" fill="freeze"/><rect x="532" y="204" width="76" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="570" y="221" text-anchor="middle">Node.js</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.3s" dur="0.4s" fill="freeze"/><rect x="618" y="204" width="74" height="26" rx="13" fill="none" stroke="#d6dde8"/><text x="655" y="221" text-anchor="middle">Python</text></g>
  </g>
  <!-- terminal card -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <rect x="828" y="52" width="336" height="196" rx="12" fill="#ffffff" stroke="#d6dde8"/>
    <circle cx="848" cy="72" r="5" fill="#ff5f57"/><circle cx="864" cy="72" r="5" fill="#febc2e"/><circle cx="880" cy="72" r="5" fill="#28c840"/>
    <text x="1148" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577" text-anchor="end">deploy.sh</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="848" y="104" fill="#5b6577" opacity="0">$ <tspan fill="#0f172a">docker build -t api:1.4.2 .</tspan><animate attributeName="opacity" to="1" begin="1.2s" dur="0.2s" fill="freeze"/></text>
      <text x="848" y="126" fill="#5b6577" opacity="0">  image built · 48 MB · 6.1s<animate attributeName="opacity" to="1" begin="1.9s" dur="0.2s" fill="freeze"/></text>
      <text x="848" y="150" fill="#5b6577" opacity="0">$ <tspan fill="#0f172a">kubectl rollout status deploy/api</tspan><animate attributeName="opacity" to="1" begin="2.5s" dur="0.2s" fill="freeze"/></text>
      <text x="848" y="172" fill="#5b6577" opacity="0">  3/3 replicas updated<animate attributeName="opacity" to="1" begin="3.2s" dur="0.2s" fill="freeze"/></text>
      <text x="848" y="196" fill="#5b6577" opacity="0">$ <tspan fill="#0f172a">curl -s /health/ready</tspan><animate attributeName="opacity" to="1" begin="3.8s" dur="0.2s" fill="freeze"/></text>
      <text x="848" y="218" fill="#16a34a" opacity="0">  200 OK · ready<animate attributeName="opacity" to="1" begin="4.4s" dur="0.2s" fill="freeze"/></text>
      <rect x="848" y="226" width="8" height="14" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="4.7s" dur="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
