    <rect x="840" y="148" width="160" height="64" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1"></rect>
    <text x="920.0" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Cloud</text>
    <text x="920.0" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577">AWS · Render · Vercel</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
    <rect x="840" y="238" width="160" height="64" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1"></rect>
    <text x="920.0" y="265" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Nginx</text>
    <text x="920.0" y="285" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577">TLS · reverse proxy</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" dur="0.4s" fill="freeze"/>
    <rect x="1040" y="148" width="120" height="64" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1"></rect>
    <text x="1100.0" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Observe</text>
    <text x="1100.0" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577">logs · health</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577" opacity="0"><animate attributeName="opacity" to="1" begin="2.2s" dur="0.6s" fill="freeze"/>
    <text x="320" y="236" text-anchor="middle">matrix · cache · path filters</text>
    <text x="520" y="236" text-anchor="middle">small image, no toolchain</text>
    <text x="720" y="236" text-anchor="middle">secrets never in the repo</text>
    <text x="1100" y="236" text-anchor="middle">request ids</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" opacity="0"><animate attributeName="opacity" to="1" begin="3.9s" dur="0.5s" fill="freeze"/>
    <rect x="40" y="320" width="1120" height="30" rx="8" fill="#ffffff" stroke="#d6dde8"/>
    <text x="56" y="339" fill="#5b6577">status:</text>
    <text x="112" y="339" fill="#0f172a">lint ✓</text>
    <text x="180" y="339" fill="#0f172a">tests ✓</text>
    <text x="256" y="339" fill="#0f172a">image ✓</text>
    <text x="330" y="339" fill="#0f172a">rollout 3/3</text>
    <text x="430" y="339" fill="#16a34a">ready</text>
    <text x="1144" y="339" fill="#5b6577" text-anchor="end">every change is reproducible, reviewed and observable in production</text>
    <rect x="108" y="325" width="56" height="20" rx="4" fill="#0ea5a4" opacity="0.25">
      <animate attributeName="x" values="108;176;252;326;426;426" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="4s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="56;64;64;90;48;48" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="4s" begin="4s" repeatCount="indefinite"/></rect>
  </g>
