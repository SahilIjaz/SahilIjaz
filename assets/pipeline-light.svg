    <text x="120.0" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577">trunk · PR · review</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <rect x="240" y="148" width="160" height="64" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1"></rect>
    <text x="320.0" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CI</text>
