    <animateMotion path="M800,180 C820,180 820,90 840,90" begin="2.7s" dur="1.6s" repeatCount="indefinite"/></circle>
  <path d="M800,180 L840,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="2.9s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M800,180 L840,180" begin="2.9s" dur="1.6s" repeatCount="indefinite"/></circle>
  <path d="M800,180 C820,180 820,270 840,270" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M800,180 C820,180 820,270 840,270" begin="3.1s" dur="1.6s" repeatCount="indefinite"/></circle>
  <path d="M1000,90 C1020,90 1020,180 1040,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="3.4s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M1000,90 C1020,90 1020,180 1040,180" begin="3.4s" dur="1.2s" repeatCount="indefinite"/></circle>
  <path d="M1000,180 L1040,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="3.6s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M1000,180 L1040,180" begin="3.6s" dur="1.0s" repeatCount="indefinite"/></circle>
  <path d="M1000,270 C1020,270 1020,180 1040,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="3.8s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M1000,270 C1020,270 1020,180 1040,180" begin="3.8s" dur="1.2s" repeatCount="indefinite"/></circle>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
