    <animateMotion path="M400,180 L440,180" begin="2.1s" dur="1.6s" repeatCount="indefinite"/></circle>
  <path d="M600,180 L640,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="2.4s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M600,180 L640,180" begin="2.4s" dur="1.6s" repeatCount="indefinite"/></circle>
