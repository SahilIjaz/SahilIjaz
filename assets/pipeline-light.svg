  <text x="1160" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5b6577" text-anchor="end">commit → verify → package → deploy → observe</text>
  <path d="M200,180 L240,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
  <circle r="4" fill="#0ea5a4" opacity="0"><animate attributeName="opacity" to="1" begin="1.8s" dur="0.1s" fill="freeze"/>
    <animateMotion path="M200,180 L240,180" begin="1.8s" dur="1.6s" repeatCount="indefinite"/></circle>
  <path d="M400,180 L440,180" fill="none" stroke="#d6dde8" stroke-width="1.5"/>
