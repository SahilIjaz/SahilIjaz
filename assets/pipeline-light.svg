  </g>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
    <rect x="440" y="148" width="160" height="64" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1"></rect>
    <text x="520.0" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Container</text>
    <text x="520.0" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577">multi-stage · pinned</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
    <rect x="640" y="148" width="160" height="64" rx="10" fill="#ffffff" stroke="#0ea5a4" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></rect>
    <text x="720.0" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Release</text>
    <text x="720.0" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6577">tag · image · manifest</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
    <rect x="840" y="58" width="160" height="64" rx="10" fill="#ffffff" stroke="#d6dde8" stroke-width="1"></rect>
